<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalon - Product Details</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background: #F5F4F0; color: #111; font-family: 'Inter', sans-serif; }
        .announcement-bar { background: #0B0B0B; color: #D4AF37; text-align: center; padding: 8px 10px; font-size: 13px; font-weight: 500; border-bottom: 1px solid #D4AF37; overflow: hidden; white-space: nowrap; }
        .announcement-bar span { display: inline-block; animation: scrollText 20s linear infinite; }
        @keyframes scrollText { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .navbar { background: #0B0B0B; border-bottom: 1px solid #D9D6CC; }
        .navbar a { color: #F5F4F0; transition: 0.3s; }
        .navbar a:hover { color: #D4AF37; }
        .hero { background: #F5F4F0; padding: 40px 0 20px 0; border-bottom: 1px solid #D9D6CC; text-align: center; }
        .hero h1 { color: #D4AF37; font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 900; letter-spacing: 0.1em; }
        .hero p { color: #666; font-size: 1rem; letter-spacing: 0.2em; margin-top: 8px; }
        .nav-categories { display: flex; justify-content: center; gap: 2rem; margin-top: 1.5rem; flex-wrap: wrap; border-top: 1px solid #D9D6CC; padding-top: 1.5rem; }
        .nav-categories a { color: #111; text-decoration: none; font-size: 0.9rem; font-weight: 500; letter-spacing: 0.05em; transition: 0.3s; padding: 4px 0; border-bottom: 2px solid transparent; }
        .nav-categories a:hover { color: #D4AF37; border-bottom-color: #D4AF37; }
        .cart-sidebar { background: #0B0B0B; border-left: 1px solid #D4AF37; }
        .cart-sidebar h3 { color: #F5F4F0; }
        .cart-sidebar .total { color: #F5F4F0; }
        .mobile-menu { background: #0B0B0B; padding: 20px; border-top: 1px solid #333; }
        .mobile-menu a { color: #F5F4F0; }
        .mobile-menu a:hover { color: #D4AF37; }
        #loader { position: fixed; inset: 0; background: #0B0B0B; display: flex; align-items: center; justify-content: center; z-index: 9999; transition: 0.6s; }
        #loader.fade-out { opacity: 0; visibility: hidden; }
        .loader-text { font-size: clamp(2.5rem, 10vw, 5rem); color: #D4AF37; font-weight: 900; letter-spacing: 0.15em; }
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px); background: #0B0B0B; border: 1px solid #D4AF37; color: #D4AF37; padding: 10px 24px; border-radius: 50px; font-size: 14px; font-weight: 600; z-index: 999; opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0px); }
        .cart-bounce { animation: cartBounce 0.4s ease; }
        @keyframes cartBounce { 0% { transform: scale(1); } 30% { transform: scale(1.3); color: #D4AF37; } 70% { transform: scale(0.9); } 100% { transform: scale(1); } }
        @media (max-width: 640px) { .nav-categories { gap: 0.8rem; font-size: 0.8rem; } }
    </style>
</head>
<body>

    <div id="loader"><div class="loader-text">PANTALON</div></div>
    <div id="toast">✓ Added to Cart</div>

    <div class="announcement-bar"><span>🚚 Free Shipping Across Egypt | Delivery in 24-48 Hours</span></div>

    <!-- HEADER -->
    <header class="navbar px-4 py-3 flex items-center justify-between relative">
        <button onclick="toggleMobile()" class="text-[#F5F4F0] text-2xl hover:text-[#D4AF37] transition block md:hidden">☰</button>
        <a href="index.html" class="text-2xl font-bold text-[#D4AF37] tracking-widest hover:opacity-80 hidden md:block">PANTALON</a>
        <div class="flex-1"></div>
        <button onclick="toggleCart()" class="relative text-[#F5F4F0] text-2xl hover:text-[#D4AF37] transition" id="cartIcon">
            <i class="fas fa-shopping-bag"></i>
            <span id="cartCount" class="absolute -top-2 -right-3 bg-red-600 text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
        </button>
        <div id="mobileMenu" class="mobile-menu hidden absolute top-full left-0 w-full z-50 flex-col gap-3">
            <a href="jeans.html">👖 Jeans</a>
            <a href="shorts.html">🩳 Shorts</a>
            <a href="sweatpants.html">🩳 Sweatpants</a>
            <a href="basics.html">👕 T-Shirts</a>
            <a href="index.html">🏠 Home</a>
        </div>
    </header>

    <main class="px-4 max-w-7xl mx-auto pb-10" style="background:#F5F4F0;">

        <!-- HERO -->
        <div class="hero">
            <h1>PANTALON</h1>
            <p>WEAR YOUR STYLE.</p>
            <div class="nav-categories">
                <a href="jeans.html">Jeans</a>
                <a href="shorts.html">Shorts</a>
                <a href="sweatpants.html">Sweatpants</a>
                <a href="basics.html">T-Shirts</a>
                <a href="index.html">Home</a>
            </div>
        </div>

        <!-- PRODUCT DETAIL -->
        <div id="productDetail" class="py-8"></div>

        <div class="text-center mt-10"><a href="javascript:history.back()" class="text-[#666] hover:text-[#111] text-sm"><i class="fas fa-arrow-left"></i> Back</a></div>

    </main>

    <!-- CART SIDEBAR -->
    <div id="overlay" class="fixed inset-0 bg-black/70 z-40 hidden" onclick="toggleCart()"></div>
    <div id="cartSidebar" class="cart-sidebar fixed top-0 right-0 h-full w-80 z-50 shadow-2xl p-6 flex flex-col transition-transform duration-300 translate-x-full">
        <div class="flex justify-between items-center border-b border-[#2a2a2a] pb-4">
            <h3 class="text-2xl font-bold text-[#F5F4F0]">🛒 Cart</h3>
            <button onclick="toggleCart()" class="text-[#666] hover:text-[#F5F4F0] text-2xl">&times;</button>
        </div>
        <div id="cartItems" class="flex-1 overflow-y-auto py-4 space-y-3"><p class="text-[#666] text-center">Cart is empty</p></div>
        <div class="border-t border-[#2a2a2a] pt-4 mt-auto">
            <div class="flex justify-between text-xl font-bold text-[#F5F4F0] mb-4"><span>Total:</span><span id="cartTotal">0 EGP</span></div>
            <button onclick="whatsappCheckout()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition flex items-center justify-center gap-2"><i class="fab fa-whatsapp text-xl"></i> Order via WhatsApp</button>
            <p class="text-[10px] text-[#666] text-center mt-2">Smart order message ready</p>
        </div>
    </div>

    <script>
        function toggleMobile() { document.getElementById('mobileMenu').classList.toggle('hidden'); }
        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('translate-x-full');
            document.getElementById('overlay').classList.toggle('hidden');
        }
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
        }
        function bounceCartIcon() {
            const icon = document.getElementById('cartIcon');
            if (icon) { icon.classList.remove('cart-bounce'); void icon.offsetWidth; icon.classList.add('cart-bounce'); }
        }
        setTimeout(() => { document.getElementById('loader').classList.add('fade-out'); }, 800);
    </script>
    <script src="script.js"></script>
    <script>
        // Load product detail on page load
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('id'));
            if (id) {
                renderProductDetail(id);
            }
        });
    </script>
</body>
</html>
